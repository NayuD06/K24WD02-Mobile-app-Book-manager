<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Book Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-body">
    <main class="auth-shell">
      <section class="auth-left">
        <div class="auth-logo-dot" aria-hidden="true"></div>
        <h1>Welcome Back !!</h1>
        <p class="auth-subtitle">Please enter your credentials to log in</p>

        <form id="loginForm" class="auth-form">
          <input type="email" id="email" placeholder="Email" required />
          <input type="password" id="password" placeholder="Password" required />
          <a href="#" class="auth-link" id="forgotLink">Forgot password?</a>
          <button type="submit" class="auth-primary-btn">SIGN IN</button>
        </form>

        <p id="status" class="status"></p>
      </section>

      <section class="auth-right">
        <div class="auth-brand-wrap">
          <div class="auth-logo-dot light" aria-hidden="true"></div>
          <h2>BookWorm</h2>
          <p>LIBRARY</p>
        </div>

        <p class="auth-right-sub">New to our platform? Sign Up now.</p>
        <button id="openSignup" class="auth-secondary-btn">SIGN UP</button>

        <form id="signupForm" class="auth-form auth-form-alt hidden">
          <input type="text" id="signupName" placeholder="Full name" required />
          <input type="email" id="signupEmail" placeholder="Email" required />
          <input type="password" id="signupPassword" placeholder="Password" required />
          <button type="submit" class="auth-secondary-btn">CREATE ACCOUNT</button>
        </form>

        <p id="signupStatus" class="status status-light"></p>
      </section>
    </main>

    <script src="script.js"></script>
    <script>
      (function () {
        const openSignup = document.getElementById('openSignup');
        const signupForm = document.getElementById('signupForm');
        const signupStatus = document.getElementById('signupStatus');
        const forgotLink = document.getElementById('forgotLink');

        forgotLink.addEventListener('click', (e) => {
          e.preventDefault();
          alert('Please contact the admin to reset your password.');
        });

        openSignup.addEventListener('click', () => {
          signupForm.classList.toggle('hidden');
          openSignup.textContent = signupForm.classList.contains('hidden') ? 'SIGN UP' : 'CLOSE';
        });

        signupForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          signupStatus.textContent = 'Creating account...';
          try {
            await window.apiHelpers.registerUser(
              document.getElementById('signupName').value,
              document.getElementById('signupEmail').value,
              document.getElementById('signupPassword').value
            );
            signupStatus.textContent = 'Account created successfully. You can sign in now.';
            signupForm.reset();
          } catch (err) {
            signupStatus.textContent = err.message || 'Failed to create account';
          }
        });
      })();
    </script>
  </body>
</html>
